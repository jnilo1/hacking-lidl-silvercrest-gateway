site_name: Hacking the Lidl Silvercrest Gateway
site_description: Open firmware for the Lidl Silvercrest Zigbee Gateway — Zigbee coordinator, Thread Border Router, or router.
site_url: https://jnilo1.github.io/hacking-lidl-silvercrest-gateway/
repo_url: https://github.com/jnilo1/hacking-lidl-silvercrest-gateway
repo_name: jnilo1/hacking-lidl-silvercrest-gateway
edit_uri: edit/main/

# Single source: .md files stay at their current location in the repo.
# The mkdocs-same-dir plugin allows docs_dir to be the repo root.
docs_dir: .
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes        # README.md becomes the section landing page
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - same-dir         # required for docs_dir: .
  - awesome-pages    # auto-nav from directory tree (used more in phase 2+)
  - section-index    # README.md → section index page

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Phase 1: explicit, minimal nav. Phase 2 will rely on awesome-pages
# to auto-discover sub-sections as exclusions are lifted.
nav:
  - Home: README.md
  - Hardware: 0-Hardware/README.md
  - Build environment: 1-Build-Environment/README.md
  - Zigbee Radio (EFR32): 2-Zigbee-Radio-Silabs-EFR32/README.md
  - Main SoC (RTL8196E): 3-Main-SoC-Realtek-RTL8196E/README.md

# Exclusions: keep the build small and clean in phase 1.
# Sub-sections (2x-*, 3x-*) are excluded for now and will be enabled
# one by one in phase 2 as their links are validated.
exclude_docs: |
  CLAUDE.md
  .claude/
  .venv-docs/
  site/
  node_modules/
  packages/
  x-tools/
  silabs-tools/
  silabs-flasher/
  SimplicityStudio/
  **/build/
  **/Output/
  **/out/
  **/firmware/
  **/linux-*/
  **/busybox-*/
  **/dropbear*/
  **/DROPBEAR_*/
  **/openthread*/
  **/ncurses*/
  **/nano-*/
  1-Build-Environment/11-realtek-tools/
  2-Zigbee-Radio-Silabs-EFR32/2[0-9]-*/
  2-Zigbee-Radio-Silabs-EFR32/CHANGELOG.md
  3-Main-SoC-Realtek-RTL8196E/3[0-9]-*/
  3-Main-SoC-Realtek-RTL8196E/CHANGELOG.md
  3-Main-SoC-Realtek-RTL8196E/3-Main-SoC-Realtek-RTL8196E/
